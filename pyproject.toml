[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livekit-plugins-voho"
dynamic = ["version"]
description = "Saudi Arabic voice for LiveKit Agents: Najdi and Hijazi accents, Arabic-English code-switching, streaming speech-to-text and text-to-speech."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Voho", email = "hello@voho.ai" }]
keywords = ["livekit", "livekit-agents", "voice-agent", "arabic", "saudi arabic", "saudi accent", "najdi", "hijazi", "gulf arabic", "arabic tts", "arabic stt", "text-to-speech", "speech-to-text", "ksa"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Natural Language :: Arabic",
]
dependencies = ["livekit-agents>=1.0", "aiohttp>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "numpy"]

[project.urls]
Documentation = "https://docs.voho.ai/livekit"
Website = "https://voho.ai"
Source = "https://github.com/yar-malik/livekit-plugins-voho"
Issues = "https://github.com/yar-malik/livekit-plugins-voho/issues"

[tool.hatch.version]
path = "livekit/plugins/voho/version.py"

[tool.hatch.build.targets.wheel]
packages = ["livekit"]

[tool.hatch.build.targets.sdist]
include = ["/livekit", "/tests", "/examples", "/README.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: talks to the real API; needs VOHO_API_KEY"]
