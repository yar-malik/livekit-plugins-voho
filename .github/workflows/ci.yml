name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest
        working-directory: tests
      # The live round trip (Arabic spoken, then transcribed back) runs only
      # where the repository has a key configured.
      - if: ${{ env.VOHO_API_KEY != '' }}
        run: pytest -m live
        working-directory: tests
        env:
          VOHO_API_KEY: ${{ secrets.VOHO_API_KEY }}
    env:
      VOHO_API_KEY: ${{ secrets.VOHO_API_KEY }}
